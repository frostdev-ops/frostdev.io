<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Gallery admin · Glaze</title>
  <link rel="stylesheet" href="/glaze/admin/style.css">
  <script src="/glaze/admin/viewer.js" defer></script>
  <script src="/glaze/admin/app.js" defer></script>
</head>
<body class="app">
  <header class="bar">
    <a class="brand" href="/glaze"><strong>frostdev</strong><span aria-hidden="true">/</span> Glaze</a>
    <nav class="sections" aria-label="Sections">
      <a id="nav-mods" href="#mods">Mods <span class="count" id="count-mods"></span></a>
      <a id="nav-looks" href="#looks">Looks <span class="count" id="count-looks"></span></a>
      <a id="nav-activity" href="#activity">Activity</a>
    </nav>
    <div class="who"><span id="email"></span><button id="logout" class="quiet" type="button">Sign out</button></div>
  </header>
  <p id="message" class="toast" role="status" aria-live="polite" hidden></p>
  <main id="workspace" class="workspace">
    <aside class="sidebar" aria-label="Submissions">
      <div class="filters" id="filters" role="group" aria-label="Show"></div>
      <input id="search" type="search" placeholder="Search name, author or id" aria-label="Search">
      <ul id="list" class="list" aria-live="polite"></ul>
    </aside>
    <section id="detail" class="detail" tabindex="-1" aria-live="polite"></section>
  </main>
  <main id="activity" class="activity" hidden>
    <h1>Activity</h1>
    <p class="muted">Every decision made in this dashboard, newest first.</p>
    <div id="limits" class="note"></div>
    <ol id="audit" class="audit"></ol>
    <button id="older" class="secondary" type="button" hidden>Show older</button>
  </main>
</body>
</html>
