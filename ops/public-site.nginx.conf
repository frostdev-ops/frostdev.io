# Include inside the frostdev.io HTTPS server, before its existing location /.
# All other paths keep the existing Rimeward proxy and relay rules.
# Preserve public HTML bytes through Cloudflare; repeat the server security
# headers because location-level add_header disables their inheritance.
location = / {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =404;
}

location ~ ^/(rimeward|rimewire|crosspane|glaze|glaze/privacy|glaze/terms|privacy)/?$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html =404;
}

# The Glaze Looks gallery: the gallery page and its submit page. Screenshots are under /projects/.
location ~ ^/glaze/looks/?$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /glaze/looks/index.html =404;
}

location ~ ^/glaze/looks/submit/?$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /glaze/looks/submit/index.html =404;
}

# The gallery server (server/gallery.mjs, Docker glaze-gallery on 127.0.0.1:8788). It counts the one-a-day limit per
# client network, so it needs the visitor's address in X-Real-IP; it trusts that header only from this proxy on
# 127.0.0.1. The address must come from Cloudflare's CF-Connecting-IP, and only for requests from Cloudflare: the
# frostdev.io server block needs nginx's realip module set as share.frostdev.io's is (set_real_ip_from for each of
# Cloudflare's published ranges, real_ip_header CF-Connecting-IP), which makes $remote_addr the visitor. Without it,
# every visitor counts as Cloudflare's edge address. No access log here: the server keeps no request logs either.
# 22k is the largest submission there can be: a glaze2 theme code of 20,000 characters with a name, credit and tags
# (server/gallery.mjs BODY_MAX, which the gallery tests hold to the same number).
location ^~ /glaze/looks/api/ {
    access_log off;
    client_max_body_size 22k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 90s;
    add_header X-Frame-Options "DENY" always;
}

# The Glaze mods API (the same server). So far it is the one route the extension GETs, the owner's signed mod blocklist
# (docs/looks-gallery.md "Mod blocklist"): public data, so this location logs nothing, passes on no visitor address or
# cookie, and takes GET (and HEAD) with no body to speak of. Anything that uploads needs its own location, with POST and
# a body cap of its own.
location ^~ /glaze/mods/api/ {
    access_log off;
    limit_except GET {
        deny all;
    }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_read_timeout 10s;
    add_header X-Frame-Options "DENY" always;
}

location = /guides {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /guides/index.html =404;
}

location ^~ /guides/ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html $uri =404;
}

location ^~ /_site/ {
    root /opt/frostdev-public/current;
    try_files $uri =404;
}

# Keep the existing marketing image URLs used by public pages.
location ^~ /projects/ {
    root /opt/frostdev-public/current;
    try_files $uri =404;
    location ~ \.vtt$ {
        types { text/vtt vtt; }
        try_files $uri =404;
    }
}

location ~ ^/(robots\.txt|sitemap\.xml|ads\.txt)$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
