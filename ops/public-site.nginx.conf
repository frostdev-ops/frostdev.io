# Include inside the frostdev.io HTTPS server, before its existing location /.
# All other paths keep the existing Rimeward proxy and relay rules.
# Preserve public HTML bytes through Cloudflare; repeat the server security
# headers because location-level add_header disables their inheritance.
location = / {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =404;
}

location ~ ^/(rimeward|rimewire|crosspane|glaze|glaze/privacy|glaze/terms|privacy)/?$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html =404;
}

location = /guides {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /guides/index.html =404;
}

location ^~ /guides/ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html $uri =404;
}

location ^~ /_site/ {
    root /opt/frostdev-public/current;
    try_files $uri =404;
}

# Keep the existing marketing image URLs used by public pages.
location ^~ /projects/ {
    root /opt/frostdev-public/current;
    try_files $uri =404;
    location ~ \.vtt$ {
        types { text/vtt vtt; }
        try_files $uri =404;
    }
}

location ~ ^/(robots\.txt|sitemap\.xml|ads\.txt)$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
