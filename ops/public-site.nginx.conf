# The gallery server (server/gallery.mjs, Docker glaze-gallery on 127.0.0.1:8788). It counts the one-a-day limit per
# client network, so it needs the visitor's address in X-Real-IP; it trusts that header only from this proxy on
# 127.0.0.1. The address must come from Cloudflare's CF-Connecting-IP, and only for requests from Cloudflare: the
# frostdev.io server block needs nginx's realip module set as share.frostdev.io's is (set_real_ip_from for each of
# Cloudflare's published ranges, real_ip_header CF-Connecting-IP), which makes $remote_addr the visitor. Without it,
# every visitor counts as Cloudflare's edge address. No access log here: the server keeps no request logs either.
# 22k is the largest submission there can be: a glaze2 theme code of 20,000 characters with a name, credit and tags
# (server/gallery.mjs BODY_MAX, which the gallery tests hold to the same number).
location ^~ /glaze/looks/api/ {
    access_log off;
    client_max_body_size 22k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 90s;
    add_header X-Frame-Options "DENY" always;
}

# A submission may carry the Look's background file as base64 (server/gallery.mjs SUBMIT_MAX: a 12 MiB video, 16 MiB as
# base64, plus the 22k above), so /submit alone takes that much; the server holds /check to 22k itself.
location = /glaze/looks/api/submit {
    access_log off;
    client_max_body_size 16406k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 90s;
    add_header X-Frame-Options "DENY" always;
}

# The Glaze mods API (the same server). What Glaze itself GETs is public data: the owner's signed mod blocklist
# (docs/looks-gallery.md "Mod blocklist") and the published mods (the listing, and a reviewed bundle when a student
# chooses "Use in Glaze"). Those locations log nothing, pass on no visitor address or cookie, and take GET (and HEAD) with
# no body to speak of.
location = /glaze/mods/api/blocklist {
    access_log off;
    limit_except GET {
        deny all;
    }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_read_timeout 10s;
    add_header X-Frame-Options "DENY" always;
}

location ^~ /glaze/mods/api/mods {
    access_log off;
    limit_except GET {
        deny all;
    }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_read_timeout 10s;
    add_header X-Frame-Options "DENY" always;
}

# The rest of the mods API: the submit page's live check and upload (POST, the .glazemod file itself) and the status
# link. Like the Looks API it counts one a day per client network, so it passes on the visitor's address (realip, above)
# and its cookie, and logs nothing. 2304k is the largest bundle Glaze reads (server/gallery.mjs MOD_BODY_MAX, its
# lib/modbundle.js cap on a zip), which the gallery tests hold to the same number. The review runs after the upload has
# been answered, so nothing here waits for a model.
location ^~ /glaze/mods/api/ {
    access_log off;
    client_max_body_size 2304k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 90s;
    add_header X-Frame-Options "DENY" always;
}

location = /guides {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /guides/index.html =404;
}

location ^~ /guides/ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html $uri =404;
}

location ^~ /_site/ {
    root /opt/frostdev-public/current;
    try_files $uri =404;
}

# Keep the existing marketing image URLs used by public pages.
location ^~ /projects/ {
    root /opt/frostdev-public/current;
    try_files $uri =404;
    location ~ \.vtt$ {
        types { text/vtt vtt; }
        try_files $uri =404;
    }
}

location ~ ^/(robots\.txt|sitemap\.xml|ads\.txt)$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
