# Private gallery dashboard, OAuth return and API. Keep cookies and the real client IP for login rate limits.
# The exact location also covers the path without a trailing slash; ^~ keeps every child out of other proxies.
location = /glaze/admin {
    access_log off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 30s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /glaze/admin/ {
    access_log off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 30s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# The gallery server (server/gallery.mjs, Docker glaze-gallery on 127.0.0.1:8788). It counts the one-a-day limit per
# client network, so it needs the visitor's address in X-Real-IP; it trusts that header only from this proxy on
# 127.0.0.1. The address must come from Cloudflare's CF-Connecting-IP, and only for requests from Cloudflare: the
# frostdev.io server block needs nginx's realip module set as share.frostdev.io's is (set_real_ip_from for each of
# Cloudflare's published ranges, real_ip_header CF-Connecting-IP), which makes $remote_addr the visitor. Without it,
# every visitor counts as Cloudflare's edge address. No access log here: the server keeps no request logs either.
# 22k is the largest submission there can be: a glaze2 theme code of 20,000 characters with a name, credit and tags
# (server/gallery.mjs BODY_MAX, which the gallery tests hold to the same number).
location ^~ /glaze/looks/api/ {
    access_log off;
    client_max_body_size 22k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 90s;
    add_header X-Frame-Options "DENY" always;
}

# A submission may carry the Look's background file as base64 (server/gallery.mjs SUBMIT_MAX: a 12 MiB video, 16 MiB as
# base64, plus the 22k above), so /submit alone takes that much; the server holds /check to 22k itself.
location = /glaze/looks/api/submit {
    access_log off;
    client_max_body_size 16406k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 90s;
    add_header X-Frame-Options "DENY" always;
}

# The Glaze mods API (the same server). What Glaze itself GETs is public data: the owner's signed mod blocklist
# (docs/looks-gallery.md "Mod blocklist") and the published mods (the listing, and a reviewed bundle when a student
# chooses "Use in Glaze"). Those locations log nothing, pass on no visitor address or cookie, and take GET (and HEAD) with
# no body to speak of.
location = /glaze/mods/api/blocklist {
    access_log off;
    limit_except GET {
        deny all;
    }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_read_timeout 10s;
    add_header X-Frame-Options "DENY" always;
}

location ^~ /glaze/mods/api/mods {
    access_log off;
    limit_except GET {
        deny all;
    }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_read_timeout 10s;
    add_header X-Frame-Options "DENY" always;
}

# The rest of the mods API: the submit page's live check and upload (POST, the .glazemod file itself) and the status
# link. Like the Looks API it counts one a day per client network, so it passes on the visitor's address (realip, above)
# and its cookie, and logs nothing. 2304k is the largest bundle Glaze reads (server/gallery.mjs MOD_BODY_MAX, its
# lib/modbundle.js cap on a zip), which the gallery tests hold to the same number. The review runs after the upload has
# been answered, so nothing here waits for a model.
location ^~ /glaze/mods/api/ {
    access_log off;
    client_max_body_size 2304k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 90s;
    add_header X-Frame-Options "DENY" always;
}

location = /guides {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /guides/index.html =404;
}

location ^~ /guides/ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html $uri =404;
}

# Kiln Launcher self-update: the update manifests (latest.json per channel: no-cache) and the release files they
# point at (one folder per version: immutable). Both live outside the site's release tree, in
# /opt/frostdev-downloads/kiln, which the Kiln repository's tools/release/publish.sh fills with rsync; a site deploy
# never touches them. The launcher's check is a plain GET without ids, and these locations keep no access log.
location ^~ /kiln/updates/ {
    alias /opt/frostdev-downloads/kiln/updates/;
    access_log off;
    limit_except GET {
        deny all;
    }
    default_type application/json;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /kiln/downloads/ {
    alias /opt/frostdev-downloads/kiln/downloads/;
    access_log off;
    limit_except GET {
        deny all;
    }
    types {
        application/json json;
        application/zip zip nupkg vsix;
        application/gzip gz;
        text/plain txt sig;
        text/markdown md;
    }
    default_type application/octet-stream;
    charset utf-8;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The API reference and modding site of a release (<version>/sdk/api/, since Kiln 0.2.0-dev.26; Kiln's
    # tools/docs-site builds it, publish.sh --sdk-site uploads it): web pages, so they get web types. Everything else
    # under /kiln/downloads/ stays a download (octet-stream, above).
    location ~ ^/kiln/downloads/(?<kiln_release>[0-9A-Za-z.+-]+)/sdk/api/(?<kiln_api_file>.*)$ {
        alias /opt/frostdev-downloads/kiln/downloads/$kiln_release/sdk/api/$kiln_api_file;
        index index.html;
        access_log off;
        limit_except GET {
            deny all;
        }
        types {
            text/html html;
            text/css css;
            application/javascript js mjs;
            application/json json map;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
            image/x-icon ico;
            font/woff2 woff2;
            font/woff woff;
            text/plain txt yml yaml;
        }
        default_type application/octet-stream;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

# Kiln download statistics: a private page for the owner (docs/kiln-download-stats.md). stats/kiln-downloads.mjs writes
# /opt/frostdev-stats/kiln/ once an hour from Cloudflare's request statistics: index.html with its numbers inside, and
# the stylesheet and script it loads. Only someone signed in to the gallery dashboard (Google, the accounts that
# dashboard allows) gets it: every request first asks the gallery server whether the session cookie is one of its own,
# through a route of the dashboard that answers 200 to a session and 401 without one (server/admin.test.mjs holds it to
# that). The browser sends that cookie only under /glaze/admin, so the page lives there, and /kiln/stats is the address
# to remember. Without a session the browser is sent to the dashboard's sign-in; when the gallery server does not
# answer, nobody gets the page. No access log, never cached, framed or indexed, and nothing inline may run.
location = /kiln/stats {
    return 302 /glaze/admin/kiln-stats/;
}

location = /kiln/stats/ {
    return 302 /glaze/admin/kiln-stats/;
}

location = /glaze/admin/kiln-stats {
    return 302 /glaze/admin/kiln-stats/;
}

location ^~ /glaze/admin/kiln-stats/ {
    alias /opt/frostdev-stats/kiln/;
    index index.html;
    auth_request /_kiln_stats_session;
    error_page 401 = @kiln_stats_sign_in;
    access_log off;
    limit_except GET {
        deny all;
    }
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

location @kiln_stats_sign_in {
    add_header Cache-Control "no-store" always;
    return 302 /glaze/admin/login;
}

# The question to the gallery server. It gets the visitor's cookie and nothing of the request's body; its answer's
# body is dropped. GET whatever the visitor's method was: the dashboard answers 405 to anything but GET and POST.
location = /_kiln_stats_session {
    internal;
    access_log off;
    proxy_pass http://127.0.0.1:8788/glaze/admin/api/live;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 10s;
}

# Kiln: the wiki (/kiln/wiki, /kiln/wiki/<page>), the agent skill page, its zip and its Markdown files.
location ^~ /kiln/ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html $uri =404;
    location ~ \.md$ {
        types { text/markdown md; }
        charset utf-8;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}

location ^~ /_site/ {
    root /opt/frostdev-public/current;
    try_files $uri =404;
}

# Keep the existing marketing image URLs used by public pages.
location ^~ /projects/ {
