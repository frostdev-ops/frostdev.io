# The Kiln relay (kilnbot repository, relay/ and ops/relay.nginx.conf): the Kiln Launcher's Discord sign-in,
# support reports, replies and testers, Docker kilnbot-relay on 127.0.0.1:8790. Copied from ops/relay.nginx.conf
# there; keep the two the same. The realip setup it needs is in the frostdev.io server block.
#
# The relay (relay/main.mjs, Docker kilnbot-relay on 127.0.0.1:8790) counts its limits per client network, so it needs
# the visitor's address in X-Real-IP, which it trusts only from 127.0.0.1. As for the gallery's locations, the address
# must come from Cloudflare's CF-Connecting-IP through the realip module (set_real_ip_from for Cloudflare's ranges,
# real_ip_header CF-Connecting-IP), so $remote_addr is the visitor. The relay keeps no request log and neither do these
# locations: access_log off on every one. Cookies pass only where the sign-in needs them (its own __Host- cookie).

# The launcher's API: JSON, and the two uploads (a report: 9 MiB at most, relay/app.mjs REQUEST_MAX). Uploads are
# streamed to the relay (proxy_request_buffering off), so nginx never writes a report zip to a temporary file on disk.
location ^~ /kiln/relay/ {
    access_log off;
    client_max_body_size 9m;
    client_body_buffer_size 128k;
    client_body_timeout 15s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_read_timeout 60s;
    proxy_cache off;
}

# The sign-in pages: the browser's start (/kiln/signin/<id>, which sends it to Discord), and the page the launcher's
