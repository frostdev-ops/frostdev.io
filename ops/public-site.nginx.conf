# frostdev HQ, the private dashboard (docs/hq.md): the gallery's review, Kiln's, Glaze's and the site's numbers, served
# by the gallery server behind Google sign-in. Keep cookies and the real client IP for login rate limits. The exact
# location also covers the path without a trailing slash; ^~ keeps every child out of other proxies. /admin itself is
# Rimeward's (the app behind location /), so HQ has its own path.
location = /hq {
    access_log off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 30s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /hq/ {
    access_log off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
