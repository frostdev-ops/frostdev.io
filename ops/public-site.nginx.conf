# Include inside the frostdev.io HTTPS server, before its existing location /.
# All other paths keep the existing Rimeward proxy and relay rules.
# Preserve public HTML bytes through Cloudflare; repeat the server security
# headers because location-level add_header disables their inheritance.
location = / {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =404;
}

location ~ ^/(rimeward|rimewire|crosspane|kiln|glaze|glaze/privacy|glaze/terms|privacy)/?$ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri/index.html =404;
}

# Glaze's Google Drive picker page (static; also on frostdev-ops.github.io/glaze-drive-picker). Glaze opens it in its
# sign-in window and checks it answers with a HEAD from the extension, hence CORS *. It must never be framed.
location ^~ /glaze/drive-picker/ {
    root /opt/frostdev-public/current;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri $uri/index.html =404;
}

