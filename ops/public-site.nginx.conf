# Kiln Launcher self-update: the update manifests (latest.json per channel: no-cache) and the release files they
# point at (one folder per version: immutable). Both live outside the site's release tree, in
# /opt/frostdev-downloads/kiln, which the Kiln repository's tools/release/publish.sh fills with rsync; a site deploy
# never touches them. The launcher's check is a plain GET without ids, and these locations keep no access log.
location ^~ /kiln/updates/ {
    alias /opt/frostdev-downloads/kiln/updates/;
    access_log off;
    limit_except GET {
        deny all;
    }
    default_type application/json;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /kiln/downloads/ {
    alias /opt/frostdev-downloads/kiln/downloads/;
    access_log off;
    limit_except GET {
        deny all;
    }
    types {
        application/json json;
        application/zip zip nupkg vsix;
        application/gzip gz;
        text/plain txt sig;
        text/markdown md;
    }
    default_type application/octet-stream;
    charset utf-8;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The static files of a release's API reference (Kiln's tools/docs-site/template, since the themed reference of
    # 0.2.0-dev.30.6): static/<name>.<first 10 hex digits of the file's SHA-256>.<ext>. A changed file gets a new name,
    # so they keep a year like the downloads; the pages and their data keep the hour below. Before the next location:
    # the first regex that matches wins.
    location ~ "^/kiln/downloads/(?<kiln_release>[0-9A-Za-z.+-]+)/sdk/api/(?<kiln_api_static>static/[A-Za-z0-9_-]+\.[0-9a-f]{10}\.(?:css|js|json|woff2|svg|webp|png))$" {
        alias /opt/frostdev-downloads/kiln/downloads/$kiln_release/sdk/api/$kiln_api_static;
        access_log off;
        limit_except GET {
            deny all;
        }
        types {
            text/css css;
            application/javascript js;
            application/json json;
            font/woff2 woff2;
            image/svg+xml svg;
            image/webp webp;
            image/png png;
        }
        default_type application/octet-stream;
        charset utf-8;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The API reference and modding site of a release (<version>/sdk/api/, since Kiln 0.2.0-dev.26; Kiln's
    # tools/docs-site builds it, publish.sh --sdk-site uploads it): web pages, so they get web types. Everything else
    # under /kiln/downloads/ stays a download (octet-stream, above).
    location ~ ^/kiln/downloads/(?<kiln_release>[0-9A-Za-z.+-]+)/sdk/api/(?<kiln_api_file>.*)$ {
        alias /opt/frostdev-downloads/kiln/downloads/$kiln_release/sdk/api/$kiln_api_file;
        index index.html;
        access_log off;
        limit_except GET {
            deny all;
        }
        types {
            text/html html;
            text/css css;
            application/javascript js mjs;
            application/json json map;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
            image/x-icon ico;
            font/woff2 woff2;
            font/woff woff;
            text/plain txt yml yaml;
        }
        default_type application/octet-stream;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

# The newest release's API reference at a stable address. /opt/frostdev-downloads/kiln/api is a symlink to
# downloads/<newest release>/sdk/api, which the Kiln repository's tools/release/publish.sh --sdk-site moves on each
# release (never back to an older one); the pinned copy of every release stays at /kiln/downloads/<version>/sdk/api/.
# Same web types as that copy, with a short cache because the target moves.
location = /kiln/api {
    return 301 /kiln/api/;
}

location ^~ /kiln/api/ {
    alias /opt/frostdev-downloads/kiln/api/;
    index index.html;
    access_log off;
    limit_except GET {
        deny all;
    }
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json map;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/x-icon ico;
        font/woff2 woff2;
        font/woff woff;
        text/plain txt yml yaml;
    }
    default_type application/octet-stream;
    charset utf-8;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The template's static files under content-hashed names (see the pinned copy's location above): a year, even
    # though the alias moves, since a release that changes one changes its name. Pages, api/toc/*.json and search/*.json
    # keep the five minutes above.
    location ~ "^/kiln/api/(?<kiln_api_static>static/[A-Za-z0-9_-]+\.[0-9a-f]{10}\.(?:css|js|json|woff2|svg|webp|png))$" {
        alias /opt/frostdev-downloads/kiln/api/$kiln_api_static;
        access_log off;
        limit_except GET {
            deny all;
        }
        default_type application/octet-stream;
        charset utf-8;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

