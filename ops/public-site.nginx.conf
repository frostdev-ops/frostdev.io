# Crucible, Kiln's modpacks (crucible repository, ops/crucible.nginx.conf there; keep the two the same): Docker
# crucible on 127.0.0.1:8792 serves /kiln/crucible (the pages, from this site's shells in /opt/frostdev-public/current,
# and its API). It counts limits per client network from X-Real-IP (the realip setup above makes $remote_addr the
# visitor) and keeps no request log; neither do these locations. Its /admin/ and /internal/ are never proxied (HQ and the
# relay call 127.0.0.1 directly; it refuses them when X-Real-IP is present). The web session cookie (__Secure-crucible,
# Path=/kiln/crucible) passes. Install only together with the Crucible service: without it these answer 502.
location ^~ /kiln/crucible/ {
    access_log off;
    client_max_body_size 2m;
    client_body_timeout 30s;
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 60s;
    proxy_cache off;
}

location = /kiln/crucible {
    access_log off;
    limit_except GET {
        deny all;
    }
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 30s;
    proxy_cache off;
}

